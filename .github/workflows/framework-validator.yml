name: Framework Validator

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validator:
    name: Component validation (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Validator dependency
        run: python -m pip install PyYAML==6.0.2

      - name: Run Validator test suite
        run: python -m unittest discover -s tests/framework_validator -p "test_*.py"

      - name: Validate Framework Components
        run: python -m scripts.framework_validator
