name: Framework Validator

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validator:
    name: Component validation (${{ matrix.os }}, Python 3.11)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Validator dependency
        run: python -m pip install PyYAML==6.0.2

      - name: Run Validator test suite
        run: python -m unittest discover -s tests/framework_validator -p "test_*.py"

      - name: Validate Framework Components
        if: ${{ always() }}
        run: python -m scripts.framework_validator --format json --output validator-report.json

      - name: Upload Validator report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: framework-validator-report-${{ matrix.os }}
          path: validator-report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Summarize Validator results
        if: ${{ always() }}
        run: python -m scripts.framework_validator.ci_summary validator-report.json

      - name: Annotate Validator errors
        if: ${{ always() }}
        run: python -m scripts.framework_validator.ci_summary validator-report.json --annotations
