name: Framework Validator

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validator:
    name: Component validation (${{ matrix.os }}, Python 3.11)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      # Hash raw repository bytes consistently across Linux and Windows.
      # Windows Git often defaults to CRLF checkout conversion.
      - name: Disable Git checkout line-ending conversion
        run: git config --global core.autocrlf false

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Validator dependency
        run: python -m pip install PyYAML==6.0.2

      - name: Run Validator test suite
        run: python -m unittest discover -s tests/framework_validator -p "test_*.py"

      - name: Run Template composition preview tests
        run: python -B -m unittest discover -s tests/template_composition_preview -p "test_*.py"

      - name: Smoke-test real-library CLI catalog and filtered validation
        run: python -m scripts.framework_validator.smoke

      - name: Export verifiable Component catalog
        run: python -m scripts.framework_validator --list-components --format json --details --catalog-metadata-sha256 --catalog-content-sha256 --output component-catalog.json

      - name: Verify exported Component catalog
        run: python -m scripts.framework_validator --catalog-input component-catalog.json --catalog-verify-details --catalog-verify-sha256 --catalog-verify-content-sha256 --format json --output catalog-verification-report.json

      - name: Upload verifiable Component catalog
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: framework-component-catalog-${{ matrix.os }}
          path: |
            component-catalog.json
            catalog-verification-report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Validate Framework Components
        if: ${{ always() }}
        run: python -m scripts.framework_validator --format json --output validator-report.json

      - name: Upload Validator report
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: framework-validator-report-${{ matrix.os }}
          path: validator-report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Summarize Validator results
        if: ${{ always() }}
        run: python -m scripts.framework_validator.ci_summary validator-report.json

      - name: Annotate Validator errors
        if: ${{ always() }}
        run: python -m scripts.framework_validator.ci_summary validator-report.json --annotations

  catalog-parity:
    name: Cross-platform Component catalog parity
    needs: validator
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out comparison script
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Download Ubuntu and Windows Component catalogs
        uses: actions/download-artifact@v6
        with:
          pattern: framework-component-catalog-*
          path: downloaded-catalogs

      - name: Compare catalog inventories and digests
        run: python -m scripts.framework_validator.ci_catalog_parity downloaded-catalogs/framework-component-catalog-ubuntu-latest/component-catalog.json downloaded-catalogs/framework-component-catalog-windows-latest/component-catalog.json
