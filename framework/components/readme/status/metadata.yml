schema_version: "1.0"

id: "README-STATUS"
name: "Repository Status"
family: "README"
version: "1.0.0"
status: Stable
priority: Required

description: >
  Muestra el estado actual del proyecto y su nivel de madurez.

maturity:
  minimum: "L2"

category: "core"

inputs:
  project_status:
    type: "enum"
    required: true

    allowed:
      - "planning"
      - "active"
      - "maintenance"
      - "archived"

  maturity:
    type: "enum"
    required: false

    allowed:
      - "L1"
      - "L2"
      - "L3"
      - "L4"

outputs:
  format: "markdown"
  file: "template.md"