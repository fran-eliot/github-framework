id: TPL-FULLSTACK
name: Full Stack Repository
family: Repository
version: 0.1.0
status: Experimental
project_type: FullStack
maturity: L2
description: >
  Plantilla reutilizable para repositorios que integran aplicaciones frontend
  y backend dentro de una misma unidad de proyecto.

components:
  required:
    - README-HERO
    - README-OVERVIEW
    - README-FEATURES
    - README-TECH-STACK
    - README-QUICK-START
    - README-DOCUMENTATION
    - README-FOOTER
    - DOC-ARCHITECTURE
    - DOC-CHANGELOG

  recommended:
    - README-STATUS
    - README-ARCHITECTURE
    - README-REPOSITORY-STRUCTURE
    - README-TESTING
    - DOC-PROJECT-STATUS
    - DOC-TESTING
    - DOC-DEPLOYMENT
    - DOC-DIAGRAMS

  optional:
    - README-ROADMAP
    - README-CONTRIBUTING
    - README-DEMO
    - README-AUTHOR
    - README-HIGHLIGHTS
    - README-LICENSE
    - DOC-ADR
    - DOC-API
    - DOC-DATABASE
    - DOC-SECURITY
    - DOC-REFERENCES